schema_version: "1.1"
name: icp-tam-builder-full-build-score-list
expected_outcome: |
  Full build, run in one go because the user asked. Runs score_accounts.py and tam_calc.py rather than doing arithmetic by hand. Reports the near-miss vocabulary flag on 'dental clinics', the straddling '5-20' range and the unknown-heavy booking_complaints field as data issues to fix. Goldilocks checks each reported as Pass / Fail / Unknown with the number against the threshold. Client-facing summary keeps a one-line basis for every assumption-based number. Because the user asked for one go, the ICP sign-off contents appear at the top and every later output is labelled 'Draft: ICP not reviewed'. Why-they-buy content is present (alternatives with n or a labelled thesis, a reason per Tier 1 criterion, offer status untested). Names the champion. Example Clinic 1, a current customer, is excluded from or flagged in the ranking. Example Clinic 8 (Tier 1, no signal) gets 'Contact now with the no-signal offer'. The client-facing summary is its own file and the brief is marked internal. Pack 1 lists the champion's titles first and excludes current customers and open deals. An icp-handoff.json is written and passes check_handoff.py, marked draft because the sign-off was skipped; Pack 1 is printed from it with the warnings under 'Carry forward'; every trigger signal has a reliability rating with a reason.
context:
  scaffold_script: place-files.sh
