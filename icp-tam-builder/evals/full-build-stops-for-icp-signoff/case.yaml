schema_version: "1.1"
name: full-build-stops-for-icp-signoff
expected_outcome: |
  Reads the website and all six transcripts, then stops at the ICP sign-off: the ICP in one sentence, why they buy (alternatives with n, the value only the client gives, pain visible from outside or a pain hypothesis, candidate offers marked untested), Tier 1 and Tier 2, disqualifiers, the evidence with verbatim quotes, the website-versus-evidence contradiction as a question with a default, and three load-bearing assumptions. It builds no scoring model, persona, sizing, pack or document. Answer key: 4 wins, all dental (calls 1, 2, 3, 6); 2 losses, both physiotherapy (calls 4, 5). Unanswered calls in calls 1, 3 and 6 (3 of 6, all won); no-shows in calls 2, 5 and 6 (3 of 6, 2 won); double booking call 3; HMO claims call 4 (lost); price call 5 (lost). Alternatives: paper diary or by hand (calls 1, 3, and 5 if manual reminder calls count), another receptionist (calls 1 and 6, and 3 if the failed hiring counts), an international scheduling app (call 2), a hospital management system (call 4).
context:
  scaffold_script: place-files.sh
